<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen flex items-center justify-center">

    <!-- Signup Card -->
    <div class="bg-white p-8 rounded-2xl shadow-xl max-w-sm w-full transition-transform hover:-translate-y-1 duration-300">
        
        <h2 class="text-2xl font-bold text-gray-800 text-center mb-6">Create Account</h2>

        <form onsubmit="handleSignup(event)" class="space-y-4">
            <!-- Name Input -->
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Full Name</label>
                <input type="text" required class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition-all" placeholder="John Doe">
            </div>

            <!-- Email Input -->
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Email Address</label>
                <input type="email" required class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition-all" placeholder="john@example.com">
            </div>

            <!-- Password Input -->
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Password</label>
                <input type="password" required class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition-all" placeholder="••••••••">
            </div>

            <!-- Submit Button -->
            <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-2 px-4 rounded-lg transition-colors shadow-lg shadow-blue-500/30 mt-2">
                Sign Up
            </button>
        </form>

        <p class="text-center text-sm text-gray-500 mt-6">
            Already have an account? 
            <a href="#" class="text-blue-600 hover:underline font-medium">Log in</a>
        </p>
    </div>

    <script>
        function handleSignup(e) {
            e.preventDefault();
            const btn = e.target.querySelector('button');
            const originalText = btn.textContent;
            
            // Simulate API call
            btn.textContent = 'Creating Account...';
            btn.disabled = true;
            btn.classList.add('opacity-75', 'cursor-not-allowed');

            setTimeout(() => {
                btn.textContent = 'Welcome Aboard!';
                btn.classList.remove('bg-blue-600', 'hover:bg-blue-700', 'shadow-blue-500/30');
                btn.classList.add('bg-green-500', 'shadow-green-500/30');
            }, 1500);
        }
    </script>

</body>
</html>
