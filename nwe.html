<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple Profile Card</title>
    <!-- Tailwind CSS for quick, nice styling -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen flex items-center justify-center">

    <!-- Card Container -->
    <div class="bg-white p-8 rounded-2xl shadow-xl max-w-xs w-full text-center transition-transform hover:-translate-y-1 duration-300">
        
        <!-- Profile Image -->
        <div class="relative w-24 h-24 mx-auto mb-4">
            <img 
                src="https://api.dicebear.com/7.x/avataaars/svg?seed=Felix" 
                alt="Profile" 
                class="rounded-full border-4 border-blue-100 shadow-sm"
            >
            <div class="absolute bottom-1 right-1 w-5 h-5 bg-green-400 border-2 border-white rounded-full"></div>
        </div>

        <!-- Text Content -->
        <h2 class="text-xl font-bold text-gray-800">Alex Developer</h2>
        <p class="text-blue-500 font-medium text-sm mb-4">Frontend Engineer</p>
        <p class="text-gray-500 text-sm mb-6">
            Passionate about building accessible and performant web interfaces.
        </p>

        <!-- Button -->
        <button onclick="sayHello()" class="bg-blue-600 hover:bg-blue-700 text-white font-semibold py-2 px-6 rounded-full w-full transition-colors shadow-lg shadow-blue-500/30">
            Connect
        </button>
    </div>

    <!-- Simple Script -->
    <script>
        function sayHello() {
            // Simple interaction
            const btn = document.querySelector('button');
            btn.textContent = "Request Sent!";
            btn.classList.add('bg-green-500', 'hover:bg-green-600');
            btn.classList.remove('bg-blue-600', 'hover:bg-blue-700');
        }
    </script>

</body>
</html>
